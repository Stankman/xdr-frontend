<div class="grid grid-nogutter py-2 px-8">
    <div class="col text-right">
        <input pInputText placeholder="Search Article..." type="text" />
    </div>
</div>
<div class="grid grid-nogutter py-2 px-8 h-full">
    <div class="col p-2">
        <ng-container *ngIf="dataSource.items.length > 0 else noArticles">
            <p-scroller styleClass="articles-scroller" [items]="dataSource.items" [itemSize]="25" [delay]="250" [appendOnly]="true">
                <ng-template pTemplate="item" let-article> 
                    <div class="col-12 lg:col-3">
                        <xdr-article-preview [article]="article"></xdr-article-preview>
                    </div>
                </ng-template>
            </p-scroller>
        </ng-container>
        <ng-template #noArticles>
            <xdr-empty-block></xdr-empty-block>
        </ng-template>
    </div>
</div>
