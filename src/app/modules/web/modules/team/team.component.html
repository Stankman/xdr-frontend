<div class="grid grid-nogutter sm:flex-column md:flex-row py-2 px-8">
    <div class="col-12 lg:col-8 p-2">
        <p-tabView styleClass="team-tabview">
            <p-tabPanel header="Staff">
                <div class="grid">
                    <div class="col p-2">
                        <ng-container *ngIf="category.children?.length > 0 else noChildren">
                            <ng-container *ngFor="let role of category.children">
                                <xdr-rank-card></xdr-rank-card>
                            </ng-container>
                        </ng-container>
                        <ng-template #noChildren>
                            <xdr-empty-block></xdr-empty-block>
                        </ng-template>
                    </div>
                </div>
            </p-tabPanel>
        </p-tabView>
    </div>
    <div class="col-12 lg:col-4 p-2">
        <xdr-info-block [title]="'TEAM.WHAT_IS.TITLE' | translate: { hotelName: 'Kubbo' }" [body]="'TEAM.WHAT_IS.BODY' | translate: { hotelName: 'Kubbo' }"></xdr-info-block>
    </div>
  </div>
