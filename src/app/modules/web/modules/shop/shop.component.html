<div class="web-container flex flex-wrap sm:flex-col md:flex-row py-2">
  <div class="w-full lg:w-2/3 py-2 lg:pr-2 flex flex-col gap-y-4">
    <ng-container>
      <div class="flex flex-wrap">
        <ng-container>
          @for (offer of dataSource.items; track offer) {
            <div class="w-full lg:w-1/2">
              <xdr-shop-offer [offer]="offer"></xdr-shop-offer>
            </div>
          }
        </ng-container>
      </div>
    </ng-container>
    <ng-template #noOffers>
    </ng-template>
  </div>
  <div class="w-full lg:w-1/3 py-2 lg:pl-2 flex flex-col gap-y-4">
    <xdr-info-block [title]="'SHOP.INFO.TITLE' | translate" [body]="'SHOP.INFO.BODY' | translate"></xdr-info-block>
  </div>
</div>
