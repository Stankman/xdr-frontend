<p-card styleClass="border-noround register-landing mb-2">
  <div class="grid px-7">
    <div class="col">
      <div class="text-6xl font-bold text-white">Join for free!</div>
    </div>
  </div>
</p-card>
<div class="grid grid-nogutter py-2 px-8">
  <div class="col-12 lg:col-4">
    <form id="registerForm" name="registerForm">
      <div class="field flex flex-column gap-2 p-2">
        <label class="text-lg" htmlFor="username">E-mail</label>
        <span class="p-input-icon-left">
          <i class="pi pi-send"></i>
          <input type="text" class="w-full" pInputText />
        </span>
      </div>
      <div class="surface-card p-2 border-round shadow-1">
        <div class="field flex flex-column gap-2">
          <label class="text-lg" htmlFor="username">Password</label>
          <p-password [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
        </div>
        <div class="field flex flex-column gap-2">
          <label class="text-lg" htmlFor="username">Repeat Password</label>
          <p-password [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
        </div>
      </div>
      <div class="field flex align-items-center gap-1 p-2">
        <p-checkbox name="group1" value="New York" inputId="ny"></p-checkbox>
        <label class="text-lg" class="m-0" for="ny">I accept the Terms of Service, Privacy Policy and Cookie Policy.</label>
      </div>
      <div class="field">
        <p-button label="Done! Let's make an avatar!" styleClass="habbo-button primary uppercase"></p-button>
      </div>
    </form>
  </div>
</div>
