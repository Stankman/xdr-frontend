<p-card styleClass="border-noround register-landing mb-2">
  <div class="grid px-7">
    <div class="col">
      <div class="text-6xl font-bold text-white" [translate]="'REGISTER.FORM.TITLE'"></div>
    </div>
  </div>
</p-card>
<div class="grid grid-nogutter py-2 px-8">
  <div class="col-12 lg:col-4">
    <form id="registerForm" name="registerForm" [formGroup]="formGroup" (submit)="onSubmit()">
      <div class="field flex flex-column gap-2 p-2">
        <label class="text-lg" [translate]="'REGISTER.FORM.INPUT.EMAIL.LABEL'"></label>
        <span class="p-input-icon-left">
          <i class="pi pi-send"></i>
          <input id="email" name="email" formControlName="email" type="text" class="w-full" pInputText />
        </span>
        <small id="email-help" [translate]="'REGISTER.FORM.INPUT.EMAIL.HELP'" [translateParams]="{ hotelName: 'Kubbo'}"></small>
      </div>
      <div class="surface-card p-2 border-round shadow-1">
        <div class="field flex flex-column gap-2">
          <label class="text-lg" [translate]="'REGISTER.FORM.INPUT.PASSWORD.LABEL'"></label>
          <p-password id="password" name="password" formControlName="password" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
          <small id="password-help" [translate]="'REGISTER.FORM.INPUT.PASSWORD.HELP'"></small>
        </div>
        <div class="field flex flex-column gap-2">
          <label class="text-lg" [translate]="'REGISTER.FORM.INPUT.PASSWORD.CONFIRM'"></label>
          <p-password id="passwordConfirm" name="passwordConfirm" formControlName="passwordConfirm" autocomplete="new-password" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
        </div>
      </div>
      <div class="field flex align-items-center gap-1 p-2">
        <p-checkbox id="tos" name="tos" formControlName="tos" [binary]="true" [value]="true" inputId="tos"></p-checkbox>
        <label class="text-lg" class="m-0" for="tos" [translate]="'REGISTER.FORM.INPUT.TOS.LABEL'"></label>
      </div>
      <div class="field text-lg" [translate]="'REGISTER.FORM.WELCOME'" [translateParams]="{ hotelName: 'Kubbo'}"></div>
      <div class="field">
        <p-button type="submit" [label]="'REGISTER.FORM.BUTTONS.REGISTER' | translate" styleClass="habbo-button primary uppercase w-full"></p-button>
      </div>
      <div class="field">
        <small [translate]="'REGISTER.FORM.INGAME_PURCHASES'"></small>
      </div>
    </form>
  </div>
</div>
