<div class="grid grid-nogutter">
  <div class="col">
    
  </div>
</div>
<div class="grid grid-nogutter px-8">
  <div class="col">
    <form id="registerForm" name="registerForm">
      <div class="formgrid grid flex-column lg:flex-row">
          <div class="field col">
              <span class="p-input-icon-left p-float-label w-19rem lg:w-19rem">
                  <i class="pi pi-user"></i>
                  <input class="w-full" name="username" id="username" formControlName="username" autocomplete="username" pInputText />
                  <label for="float-input" [translate]="'REGISTER.FORM.INPUT.USERNAME.LABEL'"></label>
              </span>
          </div>
          <div class="field col pt-2 lg:pt-0">
              <span class="p-input-icon-left p-float-label w-19rem lg:w-19rem">
                  <i class="pi pi-send"></i>
                  <input class="w-full" type="email" name="mail" id="mail" autocomplete="off" formControlName="mail" pInputText />
                  <label for="float-input" [translate]="'REGISTER.FORM.INPUT.MAIL.LABEL'"></label>
              </span>
          </div>
      </div>
      <div class="formgrid grid flex-column lg:flex-row">
          <div class="field col pt-2">
              <span class="p-input-icon-left p-float-label w-19rem lg:w-19rem">
                  <i class="pi pi-lock"></i>
                  <input class="w-full" type="password" name="password" id="password" autocomplete="new-password" formControlName="password" pInputText />
                  <label for="float-input" [translate]="'REGISTER.FORM.INPUT.PASSWORD.LABEL'"></label>
              </span>
          </div>
          <div class="field col pt-2">
              <span class="p-input-icon-left p-float-label w-19rem lg:w-19rem">
                  <i class="pi pi-lock"></i>
                  <input class="w-full" type="password" name="passwordConfirm" id="passwordConfirm" autocomplete="new-password" formControlName="passwordConfirm" pInputText />
                  <label for="float-input" [translate]="'REGISTER.FORM.INPUT.PASSWORD.LABEL2'"></label>
              </span>
          </div>
      </div>
    </form>
  </div>
</div>
