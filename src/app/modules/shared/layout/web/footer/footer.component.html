<p-card styleClass="border-noround">
  <div class="grid grid-nogutter justify-content-between px-8">
    <div class="col-12 md:col-4 text-center lg:text-left">
      <img src="/assets/resources/images/habbo_logo.png" alt="hotel-logo">
      <p class="text-center md:text-left text-sm" [translate]="'FOOTER.DESCRIPTION'"></p>
    </div>
    <div class="col-4 md:col-3 sm:text-center lg:text-left">
      <div class="font-bold text-lg mb-2" [translate]="'FOOTER.QUICKLINKS'"></div>
      <ul class="list-none m-0 p-0">
          <li><a class="no-underline">Community</a></li>
          <li><a class="no-underline" >News</a></li>
          <li><a class="no-underline" >Our Team</a></li>
      </ul>
    </div>
    <div class="col-4 md:col-3 sm:text-center lg:text-left">
      <div class="font-bold text-lg mb-2" [translate]="'FOOTER.INFORMATION'"></div>
      <ul class="list-none m-0 p-0">
          <li><a class="no-underline cursor-pointer" >What's Kubbo?</a></li>
          <li><a class="no-underline cursor-pointer">Terms of Service</a></li>
          <li><a class="no-underline cursor-pointer" >Privacy Policy</a></li>
          <li><a class="no-underline cursor-pointer" >Cookie Policy</a></li>
      </ul>
    </div>
    <div class="col-4 md:col-2 text-right">
      <div class="font-bold text-lg mb-2" [translate]="'FOOTER.POWERED'"></div>
      <ul class="flex justify-content-end list-none m-0 p-0">
          <li class="mx-2">
              <a target="_blank"><img src="/assets/resources/images/xdr_icon_logo_32.png" alt="xdr-logo"></a>
          </li>
          <li class="mx-2">
              <a href="https://git.krews.org/nitro" target="_blank">
                <img [src]="'/assets/resources/images/nitro_icon_' + themeName + '_logo_32.png'" alt="nitro-logo">
              </a>
          </li>
      </ul>
    </div>
  </div>
  <div class="grid grid-nogutter">
    <div class="col">
      <p class="text-center text-xs" [innerHTML]="'FOOTER.COPYRIGHT' | translate: { hotelName: 'Kubbo' }">
      </p>
    </div>
  </div>
</p-card>
