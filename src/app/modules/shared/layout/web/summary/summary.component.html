<p-card styleClass="xdr-card hero recent-users">
    <ng-template pTemplate="header">
        <div class="grid grid-nogutter p-4" [@hero]>
            <div class="col-12">
                <div id="hero-title" class="text-3xl" [innerHTML]="'ME.HERO.WELCOME' | translate: {'username': account.active_avatar.username }"></div>
            </div>
            <div class="col-12 flex mt-6 flex-column align-items-center justify-content-center">
                <div id="hero-avatar" class="habbo-mannequin-container head-large">
                    <div class="avatar-container">
                        <img [src]="look" [alt]="account.active_avatar.username">
                    </div>
                </div>
            </div>
            <div class="col-12 text-center mt-1">
                <p-button styleClass="habbo-button p-button-lg p-button-success" icon="flashy-arrow" [label]="'ME.HERO.PLAY' | translate: { hotelName: 'Kubbo' }"></p-button>
            </div>
        </div>
    </ng-template>
    <div class="grid">
        <div class="col-12">
            <div class="text-2xl font-bold py-2" [translate]="'ME.HERO.PURSE'"></div>
            <ul class="wallet m-0 p-0 list-none">
                <li class="wallet-item flex align-items-center p-2 border-round">
                    <span class="habbo-web-icon credit mr-1"></span>
                    {{ account.active_avatar.credits }} {{ 'CURRENCY.CREDIT' | translate }}
                </li>
                <li class="wallet-item flex align-items-center p-2 border-round">
                    <span class="habbo-web-icon ducket mr-1"></span>
                    0 {{ 'CURRENCY.DUCKET' | translate }}
                </li>
                <li class="wallet-item flex align-items-center p-2 border-round">
                    <span class="habbo-web-icon-7 vip mr-1"></span>
                    <ng-container *ngIf="true else joinVIP">
                        {{ 'ME.HERO.VIP.EXPIRE' | translate }}
                    </ng-container>
                    <ng-template #joinVIP>
                        <a routerLink="/shop" [translate]="'ME.HERO.VIP.JOIN'"></a>
                    </ng-template>
                </li>
            </ul>
        </div>
    </div>
    <ng-template pTemplate="footer">
        <p-divider styleClass="my-1"></p-divider>
        <div class="grid grid-nogutter">
            <div class="col-12">
                <div class="flex align-items-end">
                    <span class="habbo-web-icon-4 time mr-1"></span>
                    <p class="m-0 text-sm">{{ 'ME.HERO.LAST_VISIT' | translate: { 'last_login': account.active_avatar.last_login } }}</p>
                </div>
            </div>
        </div>
    </ng-template>
</p-card>
