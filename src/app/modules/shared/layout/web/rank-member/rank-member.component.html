<div class="staff-content rounded-md shadow-md overflow-hidden">
    <div class="flex flex-wrap">
        <div class="min-w-0 flex-1">
            <div class="rank-member-header flex items-end">
                <span [ngClass]="status ? 'online' : 'offline'" class="habbo-web-icon"></span>                                     
                <div [ngClass]="status ? 'online' : 'offline'" class="member-title text-xl text-white font-bold mx-1">
                    {{ member.username }}
                </div>
            </div>
        </div>
    </div>
    <div class="flex flex-wrap">
        <div class="min-w-0 flex-1 p-0">
            <div [ngClass]="{ 'online' : status }" class="staff-plate habbo-mannequin-plates">
                <img [src]="figure" alt="username">
            </div>
        </div>
        <div class="min-w-0 flex-1 p-2">
            <div class="information h-full flex flex-col justify-around">
                <div class="motto text-white text-sm my-2 truncate"><i class="pi pi-minus text-xs"></i> {{ member.motto }}</div>
                <div class="last_connection text-right text-xs text-white font-light opacity-90">{{ member.lastLogin }}</div>
            </div>
        </div>
    </div>
</div>
