<div class="article-item bg-cover relative flex flex-column justify-content-around" [ngStyle]="{ 'background-image': 'url(' + article.image + ')' }">
    <span class="absolute w-full h-full bg-black-alpha-40"></span>
    <div class="article-item-content p-3 w-6">
        <a routerLink="/article/1-hola" ngClass="article-title uppercase font-bold text-2xl no-underline">
            {{ article.title }}
        </a>
        <div class="article-information">
            <div class="article-created-at text-xs flex align-items-center">
                <span class="habbo-web-icon time mr-1"></span>
                2 hours ago - Stankman
            </div>
        </div>
        <div class="article-summary text-sm">
            {{ article.description }}
        </div>
    </div>
    <div class="article-item-controls p-3 text-right">
        <p-button routerLink="/article/1-hola" label="Read More.." styleClass="habbo-button p-button-primary p-button-raised uppercase"></p-button>
    </div>
</div>
