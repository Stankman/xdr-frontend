<div class="article-item bg-cover relative flex flex-column justify-content-around" [ngStyle]="{ 'background-image': 'url(https://images.habbo.com/web_images/habbo-web-articles/lpromo_24042023.png)' }">
    <span class="absolute w-full h-full bg-black-alpha-40"></span>
    <div class="article-item-content p-3 w-6">
        <a ngClass="article-title uppercase font-bold text-2xl no-underline">
            XDR Frontend hello
        </a>
        <div class="article-information">
            <div class="article-created-at text-xs flex align-items-center">
                <span class="habbo-web-icon time mr-1"></span>
                2 hours ago - Stankman
            </div>
        </div>
        <div class="article-summary text-sm">
            I'm working on this frontend!
        </div>
    </div>
    <div class="article-item-controls p-3 text-right">
        <p-button label="Read More.." styleClass="p-button-primary p-button-raised uppercase"></p-button>
    </div>
</div>
