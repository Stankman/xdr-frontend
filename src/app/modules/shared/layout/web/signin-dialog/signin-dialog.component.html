<div class="signin-shell">
  <aside class="signin-art" aria-hidden="true">
    <div class="signin-art-copy">
      <span class="signin-eyebrow">{{ 'LOGIN.LANDING.EYEBROW' | translate: { hotelName } }}</span>
      <p class="signin-art-title">{{ 'LOGIN.FORM.ART_TITLE' | translate }}</p>
    </div>
    <img class="signin-art-frank" src="/assets/resources/images/frank_6.gif" alt="">
  </aside>

  <section class="signin-panel" aria-labelledby="signin-title">
    <header class="signin-heading">
      <h2 id="signin-title">{{ 'LOGIN.FORM.TITLE' | translate }}</h2>
      <p>{{ 'LOGIN.FORM.SUBTITLE' | translate }}</p>
    </header>

    <form class="signin-form" [formGroup]="formGroup" (ngSubmit)="onSubmit()" novalidate>
      <div class="signin-field">
        <label for="email">{{ 'LOGIN.FORM.INPUT.IDENTIFICATION.LABEL' | translate }}</label>
        <div class="signin-control">
          <i class="pi pi-envelope" aria-hidden="true"></i>
          <input id="email" name="email" autocomplete="email" formControlName="email" type="email" pInputText />
        </div>
      </div>

      <div class="signin-field">
        <div class="signin-label-row">
          <label for="signin-password">{{ 'LOGIN.FORM.INPUT.PASSWORD.LABEL' | translate }}</label>
          <button type="button" class="signin-link" (click)="openPasswordDialog()">{{ 'LOGIN.FORM.FORGOT' | translate }}</button>
        </div>
        <div class="signin-control">
          <i class="pi pi-lock" aria-hidden="true"></i>
          <p-password inputId="signin-password" inputStyleClass="w-full" class="w-full" name="password" autocomplete="current-password" formControlName="password" [feedback]="false" [toggleMask]="true"></p-password>
        </div>
      </div>

      <p-button type="submit" [loading]="submitting" [disabled]="submitting" styleClass="habbo-button web-green-button signin-submit"
        [label]="'LOGIN.FORM.BUTTONS.LOGIN' | translate" icon="pi pi-arrow-right" iconPos="right"></p-button>
    </form>

    <footer class="signin-footer">
      <span>{{ 'LOGIN.FORM.NO_ACCOUNT' | translate }}</span>
      <a routerLink="/registration" (click)="close()">
        {{ 'LOGIN.FORM.BUTTONS.REGISTER' | translate }}
        <i class="pi pi-arrow-right" aria-hidden="true"></i>
      </a>
    </footer>
  </section>
</div>
