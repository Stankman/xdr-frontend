
<p-card class="shadow-md my-4">
  <ng-template #header>
    <div class="text-2xl text-center font-bold">
      {{ rank.rank_name }}
    </div>
  </ng-template>
  @if (rank.avatars.length > 0) {
    <div class="flex flex-wrap">
      @for (user of rank.avatars; track user) {
        <div class="w-full lg:w-1/3">
          <xdr-rank-member></xdr-rank-member>
        </div>
      }
    </div>
  } @else {
    <xdr-empty-block></xdr-empty-block>
  }
</p-card>
