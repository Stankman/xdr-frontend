<a class="no-underline cursor-pointer">
    <div class="article shadow-2" [style.background-image]="'url(' + article.image + ')'">
        <div class="article-information">
            <div class="article-title text-xl text-overflow-ellipsis">
                {{ article.title }}
            </div>
            <div class="article-date text-xs">
                Nothing Special
            </div>
            <div class="article-summary text-sm text-overflow-ellipsis">
                {{ article.description }}
            </div>
        </div>
    </div>
</a>
