<p-card class="xdr-card recent-users min-h-full" [header]="'COMMON.RECENT_USERS' | translate">
  <ng-container>
    <ul class="recent-users-list list-none p-0">
      @for (number of [0,1,2]; track number) {
        <li class="recent-users-item p-ripple cursor-pointer">
          <a pRipple>
            <xdr-list-member></xdr-list-member>
          </a>
        </li>
      }
    </ul>
  </ng-container>
</p-card>
